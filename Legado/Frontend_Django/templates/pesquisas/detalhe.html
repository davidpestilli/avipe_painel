{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h1 class="h3 mb-1">Detalhe do registro</h1>
        <p class="text-secondary mb-0">Visualizacao completa da linha selecionada no banco AVIPE.</p>
    </div>
    <div class="d-flex gap-2">
        <a class="btn btn-outline-secondary" href="{% if voltar_para %}{{ voltar_para }}{% else %}{% url 'pesquisas:lista' %}{% endif %}">Voltar para consultas</a>
        <a class="btn btn-outline-secondary" href="{% url 'pesquisas:dashboard' %}">Voltar ao resumo</a>
    </div>
</div>

<div class="card shadow-sm">
    <div class="card-body">
        <dl class="row mb-0">
            {% for chave, valor in registro.items %}
            <dt class="col-sm-4 col-lg-3 text-secondary">{{ chave }}</dt>
            <dd class="col-sm-8 col-lg-9">{{ valor|default:"-" }}</dd>
            {% endfor %}
        </dl>
    </div>
</div>
{% endblock %}
